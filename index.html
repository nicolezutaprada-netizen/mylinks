    <!-- Canvas para el efecto Matrix de fondo -->
    <canvas id="canvas-matrix"></canvas>

    <!-- ============================================================
         JAVASCRIPT: Efecto Matrix animado en el canvas de fondo
         ============================================================ -->
    <script>

        const canvas = document.getElementById('canvas-matrix');
        const ctx    = canvas.getContext('2d');

        // Caracteres que caen (binario + japonés + símbolos tech)
        const caracteres = '01アイウエカキクサシスタチナニ{}[]<>/\\=+-*%$#@!?';

        let columnas;
        let gotas;

        // Ajusta el tamaño del canvas al de la ventana
        function ajustarTamano() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;

            columnas = Math.floor(canvas.width / 16);
            gotas    = Array(columnas).fill(1);
        }

        // Dibuja un frame de la animación
        function dibujar() {
            // Fondo semitransparente para el efecto de estela
            ctx.fillStyle = 'rgba(6, 6, 8, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = '13px monospace';

            gotas.forEach((y, i) => {
                const caracter = caracteres[Math.floor(Math.random() * caracteres.length)];

                // Columnas alternas: teal o violeta
                ctx.fillStyle   = i % 3 === 0 ? '#7c3aed' : '#00e5a0';
                ctx.globalAlpha = Math.random() * 0.7 + 0.15;

                ctx.fillText(caracter, i * 16, y * 16);
                ctx.globalAlpha = 1;

                // Reinicia la gota cuando llega al fondo
                if (gotas[i] * 16 > canvas.height && Math.random() > 0.96) {
                    gotas[i] = 0;
                }

                gotas[i]++;
            });
        }

        // Inicializa y arranca la animación
        ajustarTamano();
        setInterval(dibujar, 55);

        // Reajusta si cambia el tamaño de la ventana
        window.addEventListener('resize', ajustarTamano);

    </script>
